name: Build binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk curl

      - name: Build AppImage
        run: |
          chmod +x packaging/linux/build_appimage.sh
          ./packaging/linux/build_appimage.sh
          mkdir -p dist
          mv -f JDS6600Controller-x86_64.AppImage dist/

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: JDS6600Controller-linux-appimage
          path: dist/JDS6600Controller-x86_64.AppImage

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "64"
            py_arch: "x64"
          - arch: "32"
            py_arch: "x86"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}

      - name: Build EXE (win${{ matrix.arch }})
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          ./packaging/windows/build_windows.ps1 -Arch ${{ matrix.arch }}

      - name: Upload artifact (win${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: JDS6600Controller-win${{ matrix.arch }}
          path: dist/JDS6600Controller-win${{ matrix.arch }}.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-appimage, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release zip archives
        run: |
          python - <<'PY2'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import shutil

          root = Path('.')
          assets = root / 'release-assets'
          out = root / 'release-bundles'
          out.mkdir(exist_ok=True)

          programs = root / 'programs'
          linux_stage = out / 'JDS6600Controller-linux'
          windows_stage = out / 'JDS6600Controller-windows'
          linux_stage.mkdir(parents=True, exist_ok=True)
          windows_stage.mkdir(parents=True, exist_ok=True)

          # add binaries
          appimages = sorted(assets.glob('**/*.AppImage'))
          for src in appimages:
              shutil.copy2(src, linux_stage / src.name)
          exes = sorted(assets.glob('**/*.exe'))
          for src in exes:
              shutil.copy2(src, windows_stage / src.name)

          # add programs folder (entire contents)
          def copy_programs(dst_root: Path):
              dst = dst_root / 'programs'
              dst.mkdir(parents=True, exist_ok=True)
              if programs.exists():
                  for item in programs.rglob('*'):
                      rel = item.relative_to(programs)
                      target = dst / rel
                      if item.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(item, target)

          copy_programs(linux_stage)
          copy_programs(windows_stage)

          def make_zip(stage_dir: Path, zip_name: str):
              zip_path = out / zip_name
              with ZipFile(zip_path, 'w', compression=ZIP_DEFLATED) as zf:
                  for path in sorted(stage_dir.rglob('*')):
                      if path.is_dir():
                          continue
                      zf.write(path, path.relative_to(stage_dir))

          make_zip(linux_stage, 'JDS6600Controller-linux.zip')
          make_zip(windows_stage, 'JDS6600Controller-windows.zip')
          PY2

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundles/JDS6600Controller-linux.zip
            release-bundles/JDS6600Controller-windows.zip
